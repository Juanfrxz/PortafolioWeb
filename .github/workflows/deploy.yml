name: Verify and deploy to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_FORMSPREE_FORM_ID: test-form-id
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static, content, link, model, and bundle gates
        run: npm run verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        run: npm run test:e2e

      - name: Run accessibility matrix
        run: npm run test:a11y

      - name: Run Lighthouse budgets
        run: npm run lighthouse

  deploy:
    name: Publish production artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PUBLIC_FORMSPREE_FORM_ID: ${{ secrets.PUBLIC_FORMSPREE_FORM_ID }}
      DEPLOY_TARGET: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require production contact configuration
        run: npm run check:production-env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production artifact
        run: npm run build

      - name: Validate production artifact and custom domain
        run: |
          npm run validate:build
          test -f dist/CNAME
          test "$(tr -d '\r\n' < dist/CNAME)" = "juanfrxz.dev"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
